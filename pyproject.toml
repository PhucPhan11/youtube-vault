[project]
name = "youtube-vault"
version = "0.1.0"
description = "Download video and audio from YouTube, Facebook, Instagram, X and other sites, using yt-dlp."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp",
    "typer",
    "rich",
    "soundcard>=0.4.4",
]

[project.scripts]
youtube-vault = "youtube_vault.cli:app"

[project.gui-scripts]
youtube-vault-gui = "youtube_vault.gui:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
