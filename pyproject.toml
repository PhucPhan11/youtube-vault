[project]
name = "youtube-vault"
version = "0.1.0"
description = "Tải video và audio YouTube về máy, dùng yt-dlp."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp",
    "typer",
    "rich",
]

[project.scripts]
youtube-vault = "youtube_vault.cli:app"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
